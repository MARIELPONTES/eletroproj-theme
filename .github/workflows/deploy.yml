name: Deploy para o site (FTP)

on:
  push:
    branches: [main]
    # O tema "Eletroproj Editorial" tem deploy próprio (deploy-editorial.yml).
    paths-ignore:
      - 'eletroproj-editorial/**'
      - '.github/workflows/deploy-editorial.yml'
  workflow_dispatch:

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Verificar configuração
        if: env.FTP_SERVER == ''
        run: echo "::warning::Secrets de FTP ainda não configurados. Deploy ignorado."

      - name: Baixar código
        if: env.FTP_SERVER != ''
        uses: actions/checkout@v4

      - name: Enviar tema por FTP (somente arquivos alterados)
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            eletroproj-editorial/**
            **/node_modules/**
            **/src/**
            **/*.map
